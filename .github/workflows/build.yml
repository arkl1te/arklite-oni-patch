# Builds Arklite on every push and pull request. Pushing a tag v<VERSION> (for example v0.1.0)
# also publishes a GitHub release with dist/Arklite-<VERSION>.zip attached.
name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, lld and llvm-dlltool
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm zip
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Arklite
          path: dist/*.zip
      # Release notes = the annotated tag's message (the changelog), as Majestic Media Player's
      # builds do. checkout only fetches the tagged commit, so the tag object itself is fetched to
      # read its message. A lightweight tag has no message of its own (%(contents) would be the
      # commit's): GitHub's generated notes then.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" ] || { echo "tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
            cat release-notes.md
            notes=(--notes-file release-notes.md)
          else
            echo "$GITHUB_REF_NAME is a lightweight tag: GitHub's generated notes"
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Arklite $(cat VERSION)" "${notes[@]}"
