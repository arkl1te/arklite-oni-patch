# Builds Arklite on every push and pull request. Pushing a tag v<VERSION> (for example v0.1.0)
# also publishes a GitHub release with dist/Arklite-<VERSION>.zip attached.
name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, lld and llvm-dlltool
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm zip
          ls -d /usr/lib/llvm-*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Arklite
          path: dist/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" ] || { echo "tag $GITHUB_REF_NAME doesn't match VERSION $(cat VERSION)"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Arklite $(cat VERSION)" --generate-notes
